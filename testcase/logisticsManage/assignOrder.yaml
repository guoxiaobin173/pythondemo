- baseInfo:
    api_name: 总调集团分配订单
    url: /api/order/pc/order/assign
    method: post
    header:
      Content-Type: application/json;charset=UTF-8
    cookies: ${get_extract_data(cookies)}
  testCase:
    - case_name: 集团成功分配订单
      json:
        orderId: ${get_extract_data(orderNo)}
        orgId: "6140913758128971280"
      validation:
        - status_code: 200
        - eq: { "message":"操作成功" }
        - contains: {"code": "20000"}
        - eq: {"data": true}

