- baseInfo:
    api_name: 获取下单材料
    url: /api/order/customer/orderPlan/getMaterial
    method: post
    header:
      Content-Type: application/json;charset=UTF-8
    cookies: ${get_extract_data(cookies)}
  testCase:
    - case_name: 成功获取下单材料
      validation:
        - eq: { "message":"操作成功" }
        - contains: {"code": "20000","status_code": 200}
      extract_list:
        materialId: $.material[*]


