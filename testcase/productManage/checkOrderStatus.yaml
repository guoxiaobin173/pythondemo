- baseInfo:
    api_name: 校验商品订单状态
    url: /coupApply/cms/checkOrderStatus
    method: post
    header:
      Content-Type: application/json;charset=UTF-8
  testCase:
    - case_name: 正常校验商品订单已支付状态
      json:
        orderNumber: ${get_extract_data(orderNumber)}
        timeStamp: ${get_stamp_time()}
      validation:
        - status_code: 200
        - eq: { "status":"0" }
        - contains: {"code": "0000"}
